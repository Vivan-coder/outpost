<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Outpost</title>
  <style>
    :root { --panel: #0b1220e6; --line: #ffffff26; --accent: #ffd24a; --bad: #ff6b5a; --good: #6be08a;
      --st: max(8px, env(safe-area-inset-top)); --sr: max(10px, env(safe-area-inset-right));
      --sb: max(12px, env(safe-area-inset-bottom)); --sl: max(8px, env(safe-area-inset-left)); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; color: #fff;
      -webkit-user-select: none; user-select: none; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent; }
    canvas#c { display: block; width: 100%; height: 100%; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    kbd { font: inherit; font-weight: 800; background: #fff; color: #111; border-radius: 5px; padding: 0 6px; margin: 0 2px; }

    #left { position: fixed; top: var(--st); left: var(--sl); width: min(40vw, 240px); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    #fps { color: #9f9; font: 10px/1.3 ui-monospace, monospace; background: #0007; padding: 3px 5px; border-radius: 4px; pointer-events: none; white-space: pre; opacity: .8; }
    #left .pills { display: flex; gap: 6px; }
    #left .pills button { padding: 7px 11px; border-radius: 999px; background: #14306be6; border: 1px solid #7fb0ff; font-size: 11px; font-weight: 800; }
    #jobs, #sourceCard, #goals { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 10px; background: var(--panel);
      border: 1px solid var(--line); font-size: 11px; line-height: 1.35; pointer-events: none; }
    #goals { pointer-events: auto; } #goals .goalsHead { background: none; padding: 0; font-size: 12px; font-weight: 700; color: #9cc4ff; width: 100%; text-align: left; }
    #goals div { padding: 2px 0; } #goals div.done { color: var(--good); }
    #alert { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 10px #ff2a1a; transition: opacity .4s; }
    body.lowsupply #alert { opacity: .55; animation: blink 1.2s steps(2) infinite; }
    #marks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .mark { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; margin: -14px 0 0 -40px; width: 80px; --c: #fff; }
    .mark i { font-style: normal; color: var(--c); font-size: 18px; line-height: 18px; text-shadow: 0 0 6px #000; }
    .mark span { font-size: 10px; font-weight: 800; color: #fff; background: #000a; border: 1px solid var(--c); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
    #workFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4; }
    #work { position: fixed; inset: 0; display: none; pointer-events: none; }
    body.working #work { display: block; } body.working #hud, body.working #left, body.working #buttons, body.working #hint, body.working #banner, body.working #marks, body.working #cross, body.working #dot, body.working #prompt, body.working #shelterBtn, body.working #toasts { display: none !important; }
    #workTop { position: absolute; top: var(--st); left: 50%; transform: translateX(-50%); width: min(92vw, 560px); display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid #7fb0ff; border-radius: 12px; padding: 8px 12px; pointer-events: auto; box-sizing: border-box; }
    #workTop b { color: var(--accent); flex: 1; font-size: 14px; } #workTop span { font-size: 12px; opacity: .85; } #workBack { background: #44506a; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
    #workHint { position: absolute; top: calc(var(--st) + 56px); left: 50%; transform: translateX(-50%); width: min(92vw, 560px); background: #0b1220ee; border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.4; text-align: center; box-sizing: border-box; }
    #workHint.warn { background: #7a1010ee; }
    #work .bar { height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; } #work .bar i { display: block; height: 100%; width: 0; background: var(--good); }
    #work > .bar { position: absolute; top: calc(var(--st) + 122px); left: 50%; transform: translateX(-50%); width: min(92vw, 560px); }
    #workGauge { position: absolute; bottom: calc(var(--sb) + 96px); left: 50%; transform: translateX(-50%); width: min(80vw, 360px); height: 26px; border-radius: 8px; background: #ffffff22; display: none; overflow: hidden; }
    #workGauge .zone { position: absolute; top: 0; bottom: 0; background: #2e9d5799; border-left: 2px solid var(--good); border-right: 2px solid var(--good); } #workGauge .needle { position: absolute; top: -2px; bottom: -2px; width: 5px; margin-left: -2px; background: #fff; border-radius: 3px; }
    #workMeter { position: absolute; right: var(--sr); top: calc(var(--st) + 140px); width: 150px; display: none; font-size: 11px; background: var(--panel); padding: 8px; border-radius: 10px; } #workMeter .bar i { background: #ffd24a; }
    #hotbar { position: absolute; bottom: var(--sb); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; max-width: 96vw; }
    #hotbar button { width: min(10.5vw, 58px); min-width: 40px; height: min(10.5vw, 58px); min-height: 40px; border-radius: 12px; background: #101a2ecc; border: 2px solid #fff4; font-size: 22px; position: relative; padding: 0; }
    #hotbar button small { position: absolute; top: 1px; left: 4px; font-size: 10px; font-weight: 800; opacity: .8; }
    #hotbar button.on { border-color: var(--accent); background: #3a3010cc; } #hotbar button.need { animation: pulse2 .9s ease-in-out infinite; box-shadow: 0 0 14px var(--accent); }
    @keyframes pulse2 { 50% { transform: scale(1.12); } }
    #introUi { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5; }
    body.intro #introUi { display: block; } body.intro #hud, body.intro #left, body.intro #buttons, body.intro #hint, body.intro #banner, body.intro #marks, body.intro #cross, body.intro #dot, body.intro #prompt, body.intro #toasts, body.intro #fps { display: none !important; }
    #introUi .bar { position: absolute; left: 0; right: 0; height: 9vh; background: #000; } #introUi .top { top: 0; } #introUi .bottom { bottom: 0; }
    #fade { position: absolute; inset: 0; background: #000; opacity: 1; }
    #introTitle { position: absolute; left: 0; right: 0; top: 38%; text-align: center; opacity: 0; transition: opacity 1.2s; } #introTitle.on { opacity: 1; }
    #introTitle b { display: block; font-size: min(14vw, 96px); letter-spacing: .25em; color: #fff; text-shadow: 0 0 30px #7fb0ff; } #introTitle span { font-size: min(4vw, 20px); color: #ffd24a; }
    #introSkip { position: absolute; right: var(--sr); bottom: calc(9vh + 12px); pointer-events: auto; background: #000a; border: 1px solid #fff6; border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 700; }
    body.intro #subtitle { bottom: calc(9vh + 60px); }
    .badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin: 2px 4px 2px 0; border: 1px solid; background: none; color: #fff; vertical-align: middle; pointer-events: auto; }
    .badge.real { border-color: #5ab0ff; background: #14306bcc; } .badge.game { border-color: #ffb870; background: #4a2a10cc; } .badge.hist { border-color: #c9c9c9; background: #333c; }
    #dose { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.4; pointer-events: auto; } #dose .doseRow { font-weight: 800; color: #ff9a8a; } #dose small { display: block; opacity: .9; }
    #stormPanel { display: none; width: 100%; box-sizing: border-box; padding: 8px; border-radius: 10px; background: #0b1d44e6; border: 1px solid #7fb0ff; pointer-events: auto; } #stormPanel b { display: block; font-size: 11.5px; color: #9cc4ff; } #stormPanel canvas { width: 100%; height: auto; border-radius: 6px; display: block; margin: 4px 0; } #stormPanel small { font-size: 9.5px; opacity: .85; line-height: 1.3; display: block; }
    body.storming #left { width: min(48vw, 300px); }
    .logRow { margin: 8px 0; padding: 8px 10px; background: #14203a; border-radius: 10px; font-size: 12.5px; line-height: 1.4; } .logRow b { color: var(--accent); }
    #judgeBar { position: fixed; left: var(--sl); bottom: var(--sb); display: none; } body.judge #judgeBar { display: block; } #judgeBar button { background: #44506a; border-radius: 12px; padding: 12px 14px; min-height: 48px; font-size: 12px; font-weight: 800; }
    #fps { display: none; } body.showfps #fps { display: block; }
    #left .pills button { min-height: 48px; } #hotbar button { min-width: 48px; min-height: 48px; } #workBack { min-height: 40px; } .chip { min-height: 48px; } .close, .opt { min-height: 48px; }
    #vrBtn { position: fixed; right: var(--sr); top: calc(var(--st) + 60px); z-index: 9; background: #1d4f91; border: 2px solid #9fd0ff; border-radius: 12px; padding: 12px 16px; min-height: 48px; font-weight: 800; font-size: 13px; }
    body.xr #vrBtn { display: none; }
    #extras { font-size: 10.5px; opacity: .85; margin: 2px 0 4px; }
    .tip { border-bottom: 2px dotted #9fd0ff; cursor: help; } #tipPop { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); width: min(88vw, 420px); background: #0b1d44; border: 2px solid #7fb0ff; border-radius: 14px; padding: 12px 16px; font-size: 15px; line-height: 1.4; z-index: 30; display: none; text-align: center; }
    .badge.arch { border-color: #b6a6ff; background: #2a2160cc; } .badge.live { border-color: #5be08a; background: #14502ecc; }
    .chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; } .chip2 { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; } .chip2.good { background: #14502ecc; border: 1px solid #5be08a; } .chip2.bad { background: #5a1a18cc; border: 1px solid #ff7b6a; }
    .decOpt { display: block !important; } .decOpt b { display: block; font-size: 15px; grid-column: auto; }
    .forecast { background: #0e1d3a; border: 1px solid #5a7fd0; border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 13px; line-height: 1.4; } .fcHead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; } .fcRow { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid #ffffff14; } .fcRow.off { opacity: .55; } .fcStep i { font-style: normal; margin-right: 6px; } .fcLine { margin: 4px 0; }
    .sumBars { margin: 8px 0; } .sumRow { display: grid; grid-template-columns: 84px 1fr 66px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; } .sumTrack { position: relative; height: 14px; background: #ffffff1f; border-radius: 7px; overflow: hidden; } .sumTrack i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; } .sumTrack .before { background: #ffffff40; } .sumTrack .after.up { background: #5be08a; opacity: .9; } .sumTrack .after.down { background: #ff7b6a; opacity: .9; height: 60%; top: 20%; } .sumVal { text-align: right; font-variant-numeric: tabular-nums; }
    .sumList { font-size: 13.5px; line-height: 1.5; } .sumTrade { font-weight: 700; color: #ffd24a; font-size: 13px; } .realNote { background: #12263f; border-left: 3px solid #5ab0ff; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.4; margin: 8px 0; }
    .budRow { margin: 10px 0 14px; } .budHead { display: flex; justify-content: space-between; font-size: 15px; } .budPct { font-weight: 900; color: #ffd24a; } .budRow small { display: block; opacity: .85; font-size: 11.5px; } .budRow input[type=range] { width: 100%; height: 34px; margin: 4px 0; accent-color: #ffd24a; touch-action: pan-y; } .budEff { color: #9fd0ff; } .gentle { background: #14502ecc; border-radius: 10px; padding: 8px 10px; font-size: 13px; } .tipHint { opacity: .75; } .btnRow { display: grid; gap: 8px; }
    #radio { position: fixed; top: calc(var(--st) + 96px); right: var(--sr); display: none; background: #1a2a4aee; border: 2px solid #7fb0ff; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; max-width: 40vw; pointer-events: none; } body.mars #radio { display: block; }
    #subtitle { position: fixed; left: 50%; bottom: calc(var(--sb) + 150px); transform: translateX(-50%); width: min(86vw, 560px); display: none; box-sizing: border-box;
      background: #0b1220ee; border: 1px solid #7fb0ff; border-radius: 14px; padding: 9px 14px; font-size: 14px; line-height: 1.35; text-align: center; pointer-events: none; }
    #subtitle b { color: #ffd24a; }
    #popups { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
    .popup { font-size: 22px; font-weight: 900; color: #ffe27a; text-shadow: 0 2px 8px #000; animation: floatup 1.6s ease-out forwards; }
    @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-70px); } }
    #btnFF.on { background: #2e9d57cc !important; border-color: #fff !important; }
    #jobs b { display: block; color: var(--accent); margin-bottom: 3px; font-size: 12px; }
    #jobs div { padding: 2px 0; } #jobs div.urgent { color: var(--bad); font-weight: 700; }
    #sourceCard { background: #0b1d44e6; border-color: #7fb0ff; display: none; font-size: 10.5px; }
    #sourceCard b { display: block; color: #9cc4ff; font-size: 11.5px; margin-bottom: 2px; }

    #hud { position: fixed; top: var(--st); right: var(--sr); width: min(44vw, 230px); padding: 8px 10px;
      border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 11px; pointer-events: none; }
    #hud .head { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; font-size: 12px; gap: 6px; }
    #hud .head span:last-child { color: var(--accent); font-weight: 600; }
    #hud .row { display: grid; grid-template-columns: 1fr 64px 24px; gap: 6px; align-items: center; margin: 3px 0; }
    #hud .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hud .track { height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
    #hud .track i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .2s linear; }
    #hud .value { text-align: right; font-variant-numeric: tabular-nums; }
    #hud .warn .label, #hud .warn .value { color: var(--bad); font-weight: 700; animation: blink 1s steps(2) infinite; }
    #hud .parts { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-weight: 700; }
    @keyframes blink { 50% { opacity: .45; } }

    #banner { position: fixed; top: var(--st); left: 50%; transform: translateX(-50%); width: min(44vw, 460px);
      padding: 8px 12px; border-radius: 12px; background: #7a1010e6; border: 1px solid #ff8a7a; text-align: center;
      font-weight: 800; font-size: 13px; display: none; pointer-events: none; }
    #banner.info { background: #5a3a00e6; border-color: var(--accent); }
    #banner small { display: block; font-weight: 500; font-size: 10px; opacity: .92; margin-top: 3px; line-height: 1.3; }
    #banner .state { display: block; font-size: 11px; margin-top: 3px; }
    #banner .state.bad { color: #ffd0c8; } #banner .state.good { color: var(--good); }
    #shelterBtn { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); display: none;
      padding: 12px 18px; border-radius: 999px; background: #e53935; font-weight: 800; font-size: 13px;
      border: 2px solid #fff; box-shadow: 0 4px 18px #000a; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }

    #storm { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s;
      background: radial-gradient(ellipse at center, #ff6a0000 35%, #ff3d0066 100%); }
    #storm.warn { opacity: .3; } #storm.on { opacity: .5; } #storm.exposed { opacity: 1; animation: blink .5s steps(2) infinite; }

    #cross { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
      pointer-events: none; --p: 0; background: conic-gradient(var(--accent) calc(var(--p) * 1%), #ffffff00 0);
      -webkit-mask: radial-gradient(circle, #0000 15px, #000 16px); mask: radial-gradient(circle, #0000 15px, #000 16px); }
    #dot { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff9; pointer-events: none; }
    #dot.hot { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    #prompt { position: fixed; left: 50%; top: calc(50% + 44px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
      padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; display: none; pointer-events: none; white-space: nowrap; }

    #task { position: fixed; left: 50%; bottom: calc(var(--sb) + 100px); transform: translateX(-50%); width: min(88vw, 400px); display: none;
      background: #0e1626f2; border: 2px solid var(--accent); border-radius: 16px; padding: 12px 14px; box-sizing: border-box; text-align: center; }
    #task h3 { margin: 0 0 4px; font-size: 15px; color: var(--accent); } #task p { margin: 0 0 8px; font-size: 12px; line-height: 1.35; }
    #task .bar { height: 12px; border-radius: 6px; background: #ffffff22; overflow: hidden; } #task .bar i { display: block; height: 100%; width: 0; background: var(--good); }
    #seq { display: none; justify-content: center; gap: 12px; margin-bottom: 10px; }
    #seq button { width: 62px; height: 62px; border-radius: 14px; background: #1a2740; border: 2px solid var(--line); font-size: 22px; font-weight: 800; }
    #seq button.lit { background: var(--accent); color: #111; border-color: #fff; box-shadow: 0 0 16px var(--accent); }
    #seq.wrong button { background: #7a1010; }
    #gauge { display: none; position: relative; height: 26px; border-radius: 8px; background: #ffffff22; margin-bottom: 10px; overflow: hidden; }
    #gauge .zone { position: absolute; top: 0; bottom: 0; background: #2e9d5799; border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
    #gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 5px; margin-left: -2px; background: #fff; border-radius: 3px; }

    #toasts { position: fixed; left: 50%; bottom: calc(var(--sb) + 6px); transform: translateX(-50%); width: min(60vw, 440px);
      display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    .toast { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 10px; font-size: 12px; text-align: center; animation: rise .25s ease-out; }
    .toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--good); } .toast.bot { border-color: #7fb0ff; background: #0b1d44f2; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    #buttons { position: fixed; right: var(--sr); bottom: var(--sb); display: grid; grid-template-columns: 70px 70px; gap: 10px; direction: ltr; }
    #buttons button { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #fff6; background: #101a2ecc; font-size: 11px; font-weight: 800; letter-spacing: .3px; touch-action: none; }
    #buttons button:active { background: #2a3a5ccc; }
    #actBtn { background: #c9861a !important; border-color: #fff !important; visibility: hidden; }
    #actBtn.on { visibility: visible; } #actBtn.held { transform: scale(.92); background: #ffb62e !important; }
    #jump { opacity: .85; }

    #placeBar { position: fixed; left: 50%; bottom: var(--sb); transform: translateX(-50%); display: none; text-align: center; width: min(90vw, 420px); }
    #placeBar p { margin: 0 0 8px; font-size: 12px; background: var(--panel); padding: 6px 10px; border-radius: 8px; display: inline-block; }
    #placeBar button { padding: 13px 20px; border-radius: 12px; font-weight: 800; font-size: 13px; margin: 0 4px; }
    #placeBtn { background: #2e9d57; } #placeBtn.bad { background: #555; } #cancelBtn { background: #44506a; }
    body.placing #buttons, body.placing #toasts { display: none; } body.placing #placeBar { display: block; }

    .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid #fff5; background: #fff1; pointer-events: none; display: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #fff6; }
    #hint { position: fixed; top: calc(var(--st) + 4px); left: 50%; transform: translateX(-50%); color: #fffc; font-size: 11px; pointer-events: none; background: #0008;
      padding: 4px 10px; border-radius: 999px; white-space: nowrap; max-width: 44vw; overflow: hidden; text-overflow: ellipsis; }

    .scrim { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
    .scrim.on { display: flex; }
    .card { width: min(94vw, 560px); max-height: 92vh; overflow-y: auto; background: #0e1626; border: 1px solid var(--line);
      border-radius: 16px; padding: 16px 18px; box-sizing: border-box; touch-action: pan-y; }
    .card h2 { margin: 0 0 8px; font-size: 19px; color: var(--accent); }
    .card p { margin: 6px 0; font-size: 13px; line-height: 1.45; }
    .card ul { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
    .card .src { font-size: 11px; opacity: .8; border-left: 3px solid var(--accent); padding-left: 8px; word-break: break-word; }
    .card .why { background: #2a1512; border: 1px solid var(--bad); border-radius: 10px; padding: 8px 10px; }
    .card .stars { font-size: 30px; letter-spacing: 4px; color: var(--accent); }
    .card canvas { width: 100%; height: auto; background: #070c16; border-radius: 10px; margin-top: 6px; }
    .card .main { display: block; width: 100%; margin-top: 12px; padding: 13px; border-radius: 12px; background: #2e9d57; font-weight: 800; font-size: 15px; }
    .opt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0;
      border-radius: 12px; background: #1a2740; border: 1px solid var(--line); align-items: center; }
    .opt i { grid-row: 1 / 3; font-style: normal; font-weight: 800; background: #fff; color: #111; border-radius: 6px; width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 12px; }
    .opt b { font-size: 14px; grid-column: 2; } .opt span { font-size: 11px; opacity: .85; grid-column: 2; }
    .opt em { grid-row: 1 / 3; grid-column: 3; font-style: normal; font-weight: 800; color: var(--accent); font-size: 12px; }
    .opt:disabled { opacity: .45; } .opt.on { background: #1f5f3a; border-color: var(--good); }
    .close { display: block; width: 100%; margin-top: 8px; padding: 11px; border-radius: 12px; background: #44506a; font-weight: 700; }
    .note { font-size: 12px; color: #ffd0c8; } .keys { font-size: 11px; opacity: .7; }
    body.touch .keys, body.touch .opt i { display: none; }

    [dir="rtl"] .card, [dir="rtl"] #sourceCard, [dir="rtl"] #jobs, [dir="rtl"] #task { direction: rtl; text-align: right; }
    [dir="rtl"] #task, [dir="rtl"] #banner, [dir="rtl"] .toast, [dir="rtl"] #prompt { direction: rtl; text-align: center; }
    [dir="rtl"] .card ul { padding-left: 0; padding-right: 18px; }
    [dir="rtl"] .opt { text-align: right; }
    [dir="rtl"] .card .src { border-left: 0; border-right: 3px solid var(--accent); padding-left: 0; padding-right: 8px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="storm"></div>
  <div id="alert"></div>
  <div id="marks"></div>
  <div id="popups"></div>
  <div id="subtitle"></div>
  <div id="judgeBar"><button id="judgeReset"></button></div>
  <div id="introUi">
    <div class="bar top"></div><div class="bar bottom"></div>
    <div id="introTitle"><b></b><span></span></div>
    <button id="introSkip"></button>
    <div id="fade"></div>
  </div>
  <div id="workFade"></div>
  <div id="work">
    <div id="workTop"><b id="workTitle"></b><span id="workStep"></span><button id="workBack"></button></div>
    <div id="workHint"></div>
    <div class="bar"><i id="workBar"></i></div>
    <div id="workGauge"><div class="zone"></div><div class="needle"></div></div>
    <div id="workMeter"><span id="workMeterLabel"></span><div class="bar"><i id="workMeterFill"></i></div></div>
    <div id="hotbar"></div>
  </div>
  <div id="left">
    <div id="fps"></div>
    <div class="pills"><button id="pauseBtn"></button><button id="dataBtn"></button></div>
    <div id="jobs"></div>
    <div id="goals"></div>
    <div id="sourceCard"></div>
    <div id="stormPanel"><b id="spTitle"></b><div id="spBadge"></div><canvas id="spChart" width="460" height="210"></canvas><small id="spNote"></small></div>
  </div>
  <div id="hint"></div>
  <div id="hud">
    <div class="head"><span id="sol"></span><span id="timeLeft"></span></div>
    <div id="bars"></div>
    <div id="extras"></div>
    <div class="parts"><span id="partsLabel"></span><span id="partsValue"></span></div>
    <div class="parts" style="margin-top:3px;padding-top:0;border:0"><span id="resLabel"></span><span id="resValue"></span></div>
    <div id="dose"></div>
  </div>
  <div id="banner"></div>
  <div id="radio"></div>
  <button id="shelterBtn"></button>
  <div id="cross"></div><div id="dot"></div>
  <div id="prompt"></div>
  <div id="task">
    <h3 id="taskTitle"></h3><p id="taskHint"></p><p id="taskWhy" style="display:none;font-size:11px;opacity:.85;border-left:3px solid #7fb0ff;padding-left:8px;text-align:left"></p>
    <div id="seq"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button></div>
    <div id="gauge"><div class="zone"></div><div class="needle"></div></div>
    <div class="bar"><i id="taskBar"></i></div>
  </div>
  <div id="toasts"></div>
  <div class="stick" id="stick"><i></i></div>
  <div id="buttons">
    <button id="buildBtn"></button>
    <button id="crewBtn"></button>
    <button id="actBtn"></button>
    <button id="btnFF"></button>
    <button id="btnSkip"></button>
    <button id="jump"></button>
  </div>
  <div id="placeBar"><p id="placeHint"></p><br /><button id="placeBtn"></button><button id="cancelBtn"></button></div>
  <div class="scrim" id="menu"><div class="card" id="menuCard"></div></div>
  <div class="scrim" id="overlay"><div class="card" id="overlayCard"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
