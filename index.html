<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Outpost</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none;
      -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #fps { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
      color: #9f9; font: 12px/1.3 ui-monospace, monospace; background: #0008; padding: 4px 6px; border-radius: 4px;
      pointer-events: none; white-space: pre; }
    #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #fffb; font-size: 13px;
      pointer-events: none; }
    .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      border: 2px solid #fff5; background: #fff1; pointer-events: none; display: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
      border-radius: 50%; background: #fff6; }
    #jump { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom));
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid #fff5; background: #fff2; color: #fff;
      font-size: 12px; display: none; }
    .touch #jump { display: block; }
    #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
      width: min(46vw, 230px); padding: 8px 10px; border-radius: 10px; background: #0b1220b0;
      border: 1px solid #ffffff22; color: #fff; font-size: 11px; pointer-events: none; }
    #hud .row { display: grid; grid-template-columns: 1fr 70px 24px; gap: 6px; align-items: center; margin: 3px 0; }
    #hud .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hud .track { height: 7px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
    #hud .track i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .2s linear; }
    #hud .value { text-align: right; font-variant-numeric: tabular-nums; }
    #hud .warn .label, #hud .warn .value { color: #ff8a7a; font-weight: 700; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fps"></div>
  <div id="hud"></div>
  <div class="stick" id="stick"><i></i></div>
  <button id="jump"></button>
  <div id="hint"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
